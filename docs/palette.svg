<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc"><title id="title">Still Water visual palette</title><desc id="desc">The site's background, ink, accent, and secondary colors with its display typography.</desc><rect width="1200" height="300" fill="#f3efe6"/><path d="M40 36H1160M40 272H1160" stroke="#6d7c4b" stroke-opacity=".7"/><text x="54" y="69" fill="#6d7c4b" font-family="Arial,sans-serif" font-size="12" letter-spacing="3">VISUAL LANGUAGE / RYOKAN</text><text x="54" y="166" fill="#e0503a" font-family="Georgia,serif" font-style="italic" font-size="62">Still Water</text><text x="54" y="220" fill="#16241e" font-family="Arial,sans-serif" font-size="20">Seven rooms. One pond. No clocks.</text><text x="54" y="254" fill="#6d7c4b" font-family="Arial,sans-serif" font-size="11" letter-spacing="1.2">SHIPPORI MINCHO · ZEN KAKU GOTHIC NEW</text><g transform="translate(800 93)"><rect width="76" height="76" fill="#f3efe6" stroke="#6d7c4b"/><rect x="90" width="76" height="76" fill="#16241e"/><rect x="180" width="76" height="76" fill="#e0503a"/><rect x="270" width="76" height="76" fill="#6d7c4b"/><g fill="#6d7c4b" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.5"><text x="0" y="96">GROUND</text><text x="90" y="96">INK</text><text x="180" y="96">ACCENT</text><text x="270" y="96">SECOND</text></g></g></svg>